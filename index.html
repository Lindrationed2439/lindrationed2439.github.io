<!DOCTYPE html>
<html>
<head>
    <title>Westberg Family Tree</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Westberg Family Tree</h1>

<!-- SEARCH -->
<div class="toolbar">
    <input id="searchInput" type="text" placeholder="Search names...">
    <div id="searchResults"></div>
</div>

<!-- MAIN TREE BUTTONS -->
<div class="toolbar">
    <button id="treeView">Main Tree</button>
    <button id="expandAll">Expand All</button>
    <button id="collapseAll">Collapse All</button>
</div>

<!-- ANCESTRY DISPLAYS -->
<h2>Ancestry Views</h2>

<div class="toolbar">
    <button id="ancestorList">Ancestor List</button>
    <button id="generationView">Generational View</button>
    <button id="surnameView">Surname View</button>
    <button id="descendantView">Descendant View</button>
</div>

<div class="toolbar">
    <button id="splitView">Paternal / Maternal Split</button>
    <button id="fanChartView">Fan Chart</button>
    <button id="timelineView">Timeline View</button>
    <button id="printableReport">Printable Report</button>
</div>

<!-- BRANCH FILTERS -->
<h2>Branch Filters</h2>

<div class="toolbar">
    <select id="branchFilter">
        <option value="">Filter Tree by Branch</option>
        <option value="Westberg">Westberg</option>
        <option value="Hornstrom">Hornstrom</option>
        <option value="LaFever">LaFever</option>
        <option value="Raymond">Raymond</option>
        <option value="Losie">Losie</option>
        <option value="Losee">Losee</option>
        <option value="Koeck">Koeck</option>
        <option value="Denton">Denton</option>
        <option value="VanFlaesbeck">VanFlaesbeck</option>
        <option value="Bearance">Bearance</option>
        <option value="Woodman">Woodman</option>
        <option value="Lamberton">Lamberton</option>
        <option value="Lakin">Lakin</option>
        <option value="Meade">Meade</option>
        <option value="Sawyer">Sawyer</option>
        <option value="Brown">Brown</option>
        <option value="Chase">Chase</option>
        <option value="Ingalls">Ingalls</option>
        <option value="Delano">Delano</option>
        <option value="O'Connell">O'Connell</option>
    </select>

    <select id="branchOnlyView">
        <option value="">Branch‑Only List View</option>
        <option value="Westberg">Westberg</option>
        <option value="Hornstrom">Hornstrom</option>
        <option value="LaFever">LaFever</option>
        <option value="Raymond">Raymond</option>
        <option value="Losie">Losie</option>
        <option value="Losee">Losee</option>
        <option value="Koeck">Koeck</option>
        <option value="Denton">Denton</option>
        <option value="VanFlaesbeck">VanFlaesbeck</option>
        <option value="Bearance">Bearance</option>
        <option value="Woodman">Woodman</option>
        <option value="Lamberton">Lamberton</option>
        <option value="Lakin">Lakin</option>
        <option value="Meade">Meade</option>
        <option value="Sawyer">Sawyer</option>
        <option value="Brown">Brown</option>
        <option value="Chase">Chase</option>
        <option value="Ingalls">Ingalls</option>
        <option value="Delano">Delano</option>
        <option value="O'Connell">O'Connell</option>
    </select>
</div>

<!-- TREE DISPLAY -->
<div id="tree"></div>

<!-- PERSON MODAL -->
<div id="personModal" class="hidden">
    <div class="modal-content">
        <h2 id="modalName"></h2>
        <p id="modalBranch"></p>
        <p id="modalBirth"></p>
        <p id="modalDeath"></p>
        <p id="modalParents"></p>
        <p id="modalSpouses"></p>
        <p id="modalChildren"></p>
        <p id="modalNotes"></p>
        <button id="closeModal">Close</button>
    </div>
</div>

<script src="tree.js"></script>

</body>
</html>
